name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run test

  e2e-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: industrial_maintenance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: industrial_maintenance_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      MQTT_HOST: localhost
      MQTT_PORT: 1883
      MQTT_SIMULATOR_PASSWORD: ci-only-dummy-simulator-password
      MQTT_BACKEND_PASSWORD: ci-only-dummy-backend-password
      JWT_SECRET: ci-only-dummy-secret-value-not-for-prod-use
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN_DAYS: 7

    steps:
      - uses: actions/checkout@v4

      - name: Start Mosquitto
        run: |
          docker run -d --name mqtt -p 1883:1883 \
            -e MQTT_SIMULATOR_PASSWORD="$MQTT_SIMULATOR_PASSWORD" \
            -e MQTT_BACKEND_PASSWORD="$MQTT_BACKEND_PASSWORD" \
            -v ${{ github.workspace }}/docker/mosquitto.conf:/mosquitto/config/mosquitto.conf \
            -v ${{ github.workspace }}/docker/mosquitto_acl.conf:/mosquitto/config/acl.conf \
            -v ${{ github.workspace }}/docker/mosquitto-entrypoint.sh:/mosquitto/config/mosquitto-entrypoint.sh \
            --entrypoint /bin/sh \
            eclipse-mosquitto:2 /mosquitto/config/mosquitto-entrypoint.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run test:e2e

  export-openapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: industrial_maintenance_openapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: industrial_maintenance_openapi
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      MQTT_HOST: localhost
      MQTT_PORT: 1883
      MQTT_BACKEND_PASSWORD: ci-only-dummy-backend-password
      JWT_SECRET: ci-only-dummy-secret-value-not-for-prod-use

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run export:openapi

      - uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: docs/openapi.json
          retention-days: 1

  frontend:
    needs: export-openapi
    runs-on: ubuntu-latest
    # contents: write lets the "Sync API types" step commit the regenerated
    # frontend/src/lib/api/schema.d.ts back to same-repo PR branches.
    permissions:
      contents: write
    env:
      # Only same-repo PRs get auto-fixed. Pushes to main and fork PRs are
      # verified instead (fork tokens are read-only; main may be protected).
      CAN_AUTOFIX: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          # On PRs, check out the real branch (not the detached merge ref) so
          # the bot can push to it. Set the API_TYPES_PUSH_TOKEN secret (a PAT
          # or GitHub App token with contents:write) if you want the bot commit
          # to re-trigger CI; commits pushed with the default GITHUB_TOKEN do
          # not start new workflow runs.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.API_TYPES_PUSH_TOKEN || github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: openapi-spec
          path: docs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Regenerate before typecheck/build so everything below runs against
      # types that match the backend as built in this very run.
      - name: Sync API types
        id: api_types
        run: |
          npm run api:types
          if git diff --quiet -- src/lib/api/schema.d.ts; then
            echo "schema.d.ts already matches the backend OpenAPI spec."
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit regenerated API types (same-repo PRs)
        if: steps.api_types.outputs.drift == 'true' && env.CAN_AUTOFIX == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/api/schema.d.ts
          git commit -m "chore(frontend): regenerate API types from backend OpenAPI"
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin "HEAD:${{ github.head_ref }}"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run size
      # Fails only where the bot could not fix the drift itself (pushes to
      # main, fork PRs). Same-repo PRs were already auto-fixed above.
      - name: API types up to date
        if: steps.api_types.outputs.drift == 'true' && env.CAN_AUTOFIX != 'true'
        run: |
          echo "::error file=frontend/src/lib/api/schema.d.ts::API types are out of date. Run 'npm run api:sync' from backend/ and commit frontend/src/lib/api/schema.d.ts."
          git diff --stat -- src/lib/api/schema.d.ts
          exit 1

  frontend-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: industrial_maintenance_ui_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: development
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: industrial_maintenance_ui_e2e
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      MQTT_HOST: localhost
      MQTT_PORT: 1883
      MQTT_SIMULATOR_PASSWORD: ci-only-dummy-simulator-password
      MQTT_BACKEND_PASSWORD: ci-only-dummy-backend-password
      JWT_SECRET: ci-only-dummy-secret-value-not-for-prod-use
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN_DAYS: 7
      DEFAULT_ADMIN_EMAIL: admin.e2e@example.com
      DEFAULT_ADMIN_PASSWORD: E2eAdminPass123!
      PORT: 3000

    steps:
      - uses: actions/checkout@v4

      - name: Start Mosquitto
        run: |
          docker run -d --name mqtt -p 1883:1883 \
            -e MQTT_SIMULATOR_PASSWORD="$MQTT_SIMULATOR_PASSWORD" \
            -e MQTT_BACKEND_PASSWORD="$MQTT_BACKEND_PASSWORD" \
            -v ${{ github.workspace }}/docker/mosquitto.conf:/mosquitto/config/mosquitto.conf \
            -v ${{ github.workspace }}/docker/mosquitto_acl.conf:/mosquitto/config/acl.conf \
            -v ${{ github.workspace }}/docker/mosquitto-entrypoint.sh:/mosquitto/config/mosquitto-entrypoint.sh \
            --entrypoint /bin/sh \
            eclipse-mosquitto:2 /mosquitto/config/mosquitto-entrypoint.sh

      - name: Build and start MQTT simulator
        run: |
          docker build -t im-simulator ${{ github.workspace }}/simulator
          sleep 2
          docker run -d --name simulator --network host \
            -e MQTT_HOST=localhost \
            -e MQTT_PORT=1883 \
            -e MQTT_USERNAME=simulator \
            -e MQTT_PASSWORD="$MQTT_SIMULATOR_PASSWORD" \
            im-simulator

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - run: npm ci
        working-directory: backend
      - run: npm run migration:run
        working-directory: backend
      - run: npm run seed
        working-directory: backend
      - run: npm run seed:demo
        working-directory: backend
      - run: npm run seed:e2e-roles
        working-directory: backend

      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

      - name: Stop MQTT simulator and broker
        if: always()
        run: docker rm -f simulator mqtt 2>/dev/null || true
